  <!--
    Yinyue's own mark, not a Lucide icon: Lucide's heart-x with the x replaced by a shuffle
    sign. Same heart path as heart-x (open at the lower right to make room), and the two
    crossing strokes are heart-x's, each finished with an arrowhead so they read as shuffle
